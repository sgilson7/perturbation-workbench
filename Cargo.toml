[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
edition = "2021"
rust-version = "1.88"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Deliberately NOT panic = "abort": that compiles panics down to a bare
# `unreachable`, so a failure surfaces in the browser as
# "Unreachable code should not be executed" with no indication of what broke.

# Test binaries carry line tables and nothing else.
#
# The protocol suite is one integration binary per module and every core edit
# relinks all of them. Line tables keep file-and-line in panic messages, which
# is the only part of debuginfo a failing assertion actually reads; the rest is
# link time and disk for nobody.
#
# When a panic needs a full backtrace with arguments and locals, ask for one for
# that run and leave the default alone:
#
#     CARGO_PROFILE_TEST_DEBUG=2 cargo test -p workbench-core --test protocol
#
# An environment variable overrides the profile, so nothing here has to be
# edited to get the old behaviour back for one command.
[profile.test]
debug = "line-tables-only"
